<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Generator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="username-display">
            <span id="generated-username">c0lISTES</span>
        </div>
        <h1 data-i18n="customize.title">Customize your username</h1>
        <div class="options-container">
            <div class="options-column">
                <div class="option">
                    <input type="radio" id="easy-to-say" name="readability" checked>
                    <label for="easy-to-say" data-i18n="mode.easyToSay">Easy to say</label>
                    <span class="info-icon"
                          data-i18n-title="mode.easyToSay.tooltip"
                          title="Avoid numbers and special characters">i</span>
                </div>
                <div class="option">
                    <input type="radio" id="easy-to-read" name="readability">
                    <label for="easy-to-read" data-i18n="mode.easyToRead">Easy to read</label>
                    <span class="info-icon"
                          data-i18n-title="mode.easyToRead.tooltip"
                          title="Avoid ambiguous characters like I, l, 1, O, 0, S, 5, B, 8, Z, and 2">i</span>
                </div>
                <div class="option">
                    <input type="radio" id="all-characters" name="readability">
                    <label for="all-characters" data-i18n="mode.allCharacters">All characters</label>
                    <span class="info-icon"
                          data-i18n-title="mode.allCharacters.tooltip"
                          title="Any character combinations like !, 7, h, K, and l1">i</span>
                </div>
            </div>
            <div class="options-column">
                <div class="option">
                    <input type="checkbox" id="uppercase">
                    <label for="uppercase" data-i18n="char.uppercase">Uppercase</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="lowercase" checked>
                    <label for="lowercase" data-i18n="char.lowercase">Lowercase</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="numbers">
                    <label for="numbers" data-i18n="char.numbers">Numbers</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="symbols">
                    <label for="symbols" data-i18n="char.symbols">Symbols</label>
                </div>
            </div>
        </div>
        <div class="length-container">
            <label for="length" data-i18n="length.label">Username Length:</label>
            <input type="number" id="length" min="3" max="30" value="8">
            <input type="range" id="length-slider" min="3" max="30" value="8">
        </div>
        <div class="button-container">
            <button id="generate-username" data-i18n="button.generate">Generate Username</button>
            <button id="copy-username" data-i18n="button.copy">Copy Username</button>
        </div>
    </div>

    <!-- Load modules first, then main script -->
    <script src="modules/i18n-manager.js"></script>
    <script src="modules/theme-manager.js"></script>
    <script src="modules/favorites-manager.js"></script>
    <script src="modules/keyboard-shortcuts.js"></script>
    <script src="modules/history-filter.js"></script>
    <script src="modules/csv-exporter.js"></script>
    <script src="popup.js"></script>
</body>
</html>
