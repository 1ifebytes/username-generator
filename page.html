<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Generator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <div class="brand">
                <img src="icon.png" alt="" class="brand-icon" aria-hidden="true">
                <div class="brand-text">
                    <p class="eyebrow">Chrome Extension</p>
                    <h1>Username Generator</h1>
                </div>
            </div>
            <p class="lede">Customize a readable username, sync length controls, and copy with one click.</p>
        </header>

        <section class="container">
            <div class="username-display">
                <span id="generated-username">c0lISTES</span>
            </div>
            <h2>Customize your username</h2>
            <div class="options-container">
                <div class="options-column">
                    <div class="option">
                        <input type="radio" id="easy-to-say" name="readability" checked>
                        <label for="easy-to-say">Easy to say</label>
                        <span class="info-icon" title="Avoid numbers and special characters">i</span>
                    </div>
                    <div class="option">
                        <input type="radio" id="easy-to-read" name="readability">
                        <label for="easy-to-read">Easy to read</label>
                        <span class="info-icon" title="Avoid ambiguous characters like I, l, 1, O, 0, S, 5, B, 8, Z, and 2">i</span>
                    </div>
                    <div class="option">
                        <input type="radio" id="all-characters" name="readability">
                        <label for="all-characters">All characters</label>
                        <span class="info-icon" title="Any character combinations like !, 7, h, K, and l1">i</span>
                    </div>
                </div>
                <div class="options-column">
                    <div class="option">
                        <input type="checkbox" id="uppercase">
                        <label for="uppercase">Uppercase</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="lowercase" checked>
                        <label for="lowercase">Lowercase</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="numbers">
                        <label for="numbers">Numbers</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="symbols">
                        <label for="symbols">Symbols</label>
                    </div>
                </div>
            </div>
            <div class="length-container">
                <label for="length">Username Length</label>
                <input type="number" id="length" min="3" max="30" value="8">
                <input type="range" id="length-slider" min="3" max="30" value="8">
            </div>
            <div class="button-container">
                <button id="generate-username">Generate Username</button>
                <button id="copy-username" class="secondary">Copy Username</button>
            </div>
        </section>
    </main>
    <script src="popup.js"></script>
</body>
</html>
